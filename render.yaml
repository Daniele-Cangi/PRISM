services:
  - type: web
    name: shadow-analyzer-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8001
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_REDIS_URL
        sync: false
      - key: RATE_LIMIT_SALT
        generateValue: true
      - key: TRUSTED_PROXY_HOPS
        sync: false
      - key: MAX_ANALYSES_PER_IP
        value: 3
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 86400
      - key: MAX_CONCURRENT_ANALYSES
        value: 2
